services:
  - type: web
    name: restaurant-api
    runtime: node
    # Build must NEVER mutate the database schema (audit C-03).
    # Migrations are applied by `prisma migrate deploy` in startCommand.
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render terminates TLS at exactly one reverse proxy in front of the
      # app. Without this, req.ip is the proxy address for every request, so
      # all rate limiters collapse into a single shared bucket and audit logs
      # cannot attribute an actor (audit H-03). Must equal the real number of
      # trusted proxies — never `true`, which would trust a spoofed
      # X-Forwarded-For chain.
      - key: TRUST_PROXY
        value: "1"
      - key: FRAME_ANCESTORS
        value: "'self'"
      - key: KEEP_ALIVE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: MANAGER_1_NAME
        sync: false
      - key: MANAGER_1_EMAIL
        sync: false
      - key: MANAGER_1_PASSWORD
        sync: false
      - key: MANAGER_2_NAME
        sync: false
      - key: MANAGER_2_EMAIL
        sync: false
      - key: MANAGER_2_PASSWORD
        sync: false
      - key: MANAGER_3_NAME
        sync: false
      - key: MANAGER_3_EMAIL
        sync: false
      - key: MANAGER_3_PASSWORD
        sync: false
      # Object Storage — REQUIRED in production. Supabase Storage (S3-compatible)
      # is the persistent backing store for all uploaded images. Render's
      # filesystem is ephemeral, so local storage would lose every image on
      # restart/redeploy/scale-out. The server FAILS CLOSED and refuses to boot
      # when STORAGE_DRIVER=supabase but SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY
      # are missing (there is intentionally no local-storage fallback).
      #
      # One-time Supabase setup: create a PUBLIC-read bucket named
      # "restaurant-assets"; writes require the service_role key (server-side
      # only, never exposed to the browser).
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: restaurant-assets
      # Self-hosted persistent-volume escape hatch only. Leave unset on Render
      # (STORAGE_DRIVER=supabase is the supported production configuration).
      - key: STORAGE_ALLOW_LOCAL_IN_PROD
        sync: false

  - type: web
    name: restaurant-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html