services:
  - type: web
    name: restaurant-api
    runtime: node
    # Build must NEVER mutate the database schema (audit C-03).
    # Migrations are applied by `prisma migrate deploy` in startCommand.
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render terminates TLS at exactly one reverse proxy in front of the
      # app. Without this, req.ip is the proxy address for every request, so
      # all rate limiters collapse into a single shared bucket and audit logs
      # cannot attribute an actor (audit H-03). Must equal the real number of
      # trusted proxies — never `true`, which would trust a spoofed
      # X-Forwarded-For chain.
      - key: TRUST_PROXY
        value: "1"
      - key: FRAME_ANCESTORS
        value: "'self'"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: MANAGER_1_NAME
        sync: false
      - key: MANAGER_1_EMAIL
        sync: false
      - key: MANAGER_1_PASSWORD
        sync: false
      - key: MANAGER_2_NAME
        sync: false
      - key: MANAGER_2_EMAIL
        sync: false
      - key: MANAGER_2_PASSWORD
        sync: false
      - key: MANAGER_3_NAME
        sync: false
      - key: MANAGER_3_EMAIL
        sync: false
      - key: MANAGER_3_PASSWORD
        sync: false

  - type: web
    name: restaurant-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html