services:
  - type: web
    name: restaurant-api
    runtime: node
    buildCommand: npm ci && npx prisma generate && npx prisma db push
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: DEMO_MANAGER_EMAIL
        sync: false
      - key: DEMO_MANAGER_PASSWORD
        sync: false
      - key: MANAGER_1_NAME
        sync: false
      - key: MANAGER_1_EMAIL
        sync: false
      - key: MANAGER_1_PASSWORD
        sync: false
      - key: MANAGER_2_NAME
        sync: false
      - key: MANAGER_2_EMAIL
        sync: false
      - key: MANAGER_2_PASSWORD
        sync: false
      - key: MANAGER_3_NAME
        sync: false
      - key: MANAGER_3_EMAIL
        sync: false
      - key: MANAGER_3_PASSWORD
        sync: false

  - type: web
    name: restaurant-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html