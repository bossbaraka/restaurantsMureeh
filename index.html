<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#020A14" />
    <meta name="description" content="مُريح للخدمات الإلكترونية — منصة إدارة المطاعم والمنيو الرقمي والطلب الذكي" />
    <title>مُريح | منصة الخدمات الإلكترونية للمطاعم</title>
    <!-- Fonts: Tajawal and Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Smooth scrolling & luxury scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0d0e11;
      }
      ::-webkit-scrollbar-thumb {
        background: #232832;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3d4555;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #0A0B0D;
        color: #F8FAFC;
        overflow-x: hidden;
        /* Safari mobile: respect safe area insets. */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        min-height: 100vh;
        /* Prevent iOS Safari "bounce" white gap under the header. */
        -webkit-overflow-scrolling: touch;
      }
      /* Safari flex gap / 100vh fixes */
      html, body, #root {
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
      /* Avoid iOS Safari auto-zoom on input focus */
      input, select, textarea, button {
        font-size: 16px;
      }
      @supports (padding-top: env(safe-area-inset-top)) {
        .safe-top { padding-top: env(safe-area-inset-top); }
      }
    </style>
  </head>
  <body class="bg-luxury-950 text-luxury-50 antialiased selection:bg-gold-500/20 selection:text-gold-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
