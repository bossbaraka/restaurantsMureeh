<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- PLATFORM APPEARANCE — pre-hydration initialization.
         The `dark` class used to be hardcoded on <html>, which made the whole
         product permanently dark and coupled platform appearance to the
         restaurant theme engine (which wrote data-theme onto the same
         element). It is now owned by PlatformAppearanceProvider.

         This inline script runs BEFORE first paint so switching to light does
         not flash a dark frame. It is deliberately minimal and PLATFORM-ONLY:
         it reads one platform key, never restaurant theme data, and never
         writes a customer (--m-*) token. Default 'dark' keeps today's look. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mureeh_appearance');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'dark';
          var resolved =
            mode === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light')
              : mode;
          var root = document.documentElement;
          if (resolved === 'dark') root.classList.add('dark');
          root.style.colorScheme = resolved;
          root.setAttribute('data-platform-appearance', resolved);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- A11y (WCAG 2.1 SC 1.4.4 Resize Text): never block pinch-zoom.
         `maximum-scale=1.0, user-scalable=no` prevented low-vision users from
         zooming the menu at all. iOS auto-zoom-on-focus is instead prevented
         the correct way — by using a >=16px font-size on form controls (see
         the `input, select, textarea` rule below). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#020A14" />
    <meta name="description" content="مُريح للخدمات الإلكترونية — منصة إدارة المطاعم والمنيو الرقمي والطلب الذكي" />
    <title>مُريح | منصة الخدمات الإلكترونية للمطاعم</title>
    <!-- SEO (crawl + indexing). The production origin is hardcoded on purpose:
         a canonical that resolved to a preview/localhost origin would deindex
         the real domain. One index.html serves every route of this SPA, so the
         canonical target is the platform landing page — the same page the
         sitemap lists — and session-scoped customer URLs (a per-table
         capability token in the query string) are excluded in robots.txt.
         The title/description above are reused verbatim, never rewritten. -->
    <link rel="canonical" href="https://mureehmenu.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="مُريح" />
    <meta property="og:url" content="https://mureehmenu.com/" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:title" content="مُريح | منصة الخدمات الإلكترونية للمطاعم" />
    <meta property="og:description" content="مُريح للخدمات الإلكترونية — منصة إدارة المطاعم والمنيو الرقمي والطلب الذكي" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="مُريح | منصة الخدمات الإلكترونية للمطاعم" />
    <meta name="twitter:description" content="مُريح للخدمات الإلكترونية — منصة إدارة المطاعم والمنيو الرقمي والطلب الذكي" />
    <!-- Structured data: only facts already published on this page. No address,
         phone, rating or price range is declared because no real value is
         available — fabricated LocalBusiness/Review markup is a spam risk,
         not an SEO win. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://mureehmenu.com/#website",
            "url": "https://mureehmenu.com/",
            "name": "مُريح",
            "inLanguage": "ar",
            "publisher": { "@id": "https://mureehmenu.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://mureehmenu.com/#organization",
            "name": "مُريح للخدمات الإلكترونية",
            "url": "https://mureehmenu.com/",
            "logo": "https://mureehmenu.com/favicon.svg"
          }
        ]
      }
    </script>
    <!-- Fonts: Tajawal and Cormorant Garamond, plus the two faces a venue may
         pick for its display screen (شاشة العرض) — Cairo and Amiri. They are
         requested, not downloaded: the browser fetches a face only when the
         page actually renders text in it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Smooth scrolling & luxury scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0d0e11;
      }
      ::-webkit-scrollbar-thumb {
        background: #232832;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3d4555;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        /* Platform tokens (see --mureeh-* in index.css), not hardcoded dark
           values. The fallbacks preserve the previous appearance if the
           stylesheet has not loaded yet. */
        background-color: var(--mureeh-canvas, #0A0B0D);
        color: var(--mureeh-text, #F8FAFC);
        overflow-x: hidden;
        /* Safari mobile: respect the HOME-INDICATOR inset only. The TOP notch
           inset is absorbed by the topmost sticky toolbar (ViewSwitcher) — the
           single compensation point — so the customer header no longer adds it
           a second time. */
        padding-bottom: env(safe-area-inset-bottom);
        min-height: 100vh;
        /* Prevent iOS Safari "bounce" white gap under the header. */
        -webkit-overflow-scrolling: touch;
      }
      /* Safari flex gap / 100vh fixes */
      html, body, #root {
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
      /* Avoid iOS Safari auto-zoom on input focus */
      input, select, textarea, button {
        font-size: 16px;
      }
      @supports (padding-top: env(safe-area-inset-top)) {
        .safe-top { padding-top: env(safe-area-inset-top); }
      }
    </style>
  </head>
  <body class="bg-luxury-950 text-luxury-50 antialiased selection:bg-gold-500/20 selection:text-gold-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
