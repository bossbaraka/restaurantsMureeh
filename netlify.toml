[build]
  command = "npm run build"
  publish = "dist"

# Platform-level SEO surfaces must serve real files, not the SPA shell.
# Order matters: specific routes first, SPA fallback last.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# SPA fallback for every other extension-less app route. Status 200
# (rewrite, not redirect) so the URL bar stays clean.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200